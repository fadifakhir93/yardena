<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Yardena – Levande vatten</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
#game{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;touch-action:none}
#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
body.touch.playing #touch{display:block}
.tb{position:absolute;pointer-events:auto;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
  color:#fff;font:bold 13px monospace;letter-spacing:1px;text-shadow:2px 2px 0 #000;
  background:rgba(30,70,110,.38);border:4px solid rgba(255,255,255,.55);box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 -4px 0 rgba(0,0,0,.25);
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
.tb.on{background:rgba(120,200,255,.55)}
#dpad{left:calc(env(safe-area-inset-left) + 14px);bottom:calc(env(safe-area-inset-bottom) + 14px);width:216px;height:68px;
  background:none;border:none;box-shadow:none;clip-path:none;gap:6px;justify-content:space-between}
#dpad .dz{width:68px;height:68px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:22px;
  background:rgba(30,70,110,.38);border:4px solid rgba(255,255,255,.55);box-shadow:0 4px 0 rgba(0,0,0,.45);
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
#dpad .dz.on{background:rgba(120,200,255,.55)}
#bJump{right:calc(env(safe-area-inset-right) + 14px);bottom:calc(env(safe-area-inset-bottom) + 14px);width:80px;height:80px}
#bWater{right:calc(env(safe-area-inset-right) + 104px);bottom:calc(env(safe-area-inset-bottom) + 40px);width:80px;height:80px;background:rgba(40,140,210,.42)}
#bPause{right:calc(env(safe-area-inset-right) + 8px);top:calc(env(safe-area-inset-top) + 8px);width:44px;height:40px;font-size:15px;opacity:.75}
#bFull{right:calc(env(safe-area-inset-right) + 64px);top:calc(env(safe-area-inset-top) + 10px);width:48px;height:44px;font-size:18px}
#bFullMenu{position:fixed;right:calc(env(safe-area-inset-right) + 10px);top:calc(env(safe-area-inset-top) + 10px);width:48px;height:44px;font-size:18px;display:none;z-index:6}
body.touch:not(.playing) #bFullMenu.ok{display:flex}
#rotate{position:fixed;inset:0;background:#0b1024;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;gap:24px}
@media (orientation:portrait){body.touch #rotate{display:flex}}
#rotPhone{width:96px;height:144px;image-rendering:pixelated;animation:rot 2.4s infinite steps(1)}
#rotText{width:300px;height:60px;image-rendering:pixelated}
@keyframes rot{0%{transform:rotate(0)}35%{transform:rotate(-30deg)}50%{transform:rotate(-60deg)}65%{transform:rotate(-90deg)}100%{transform:rotate(-90deg)}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="384" height="216"></canvas></div>
<div id="touch">
  <div id="dpad" class="tb"><div class="dz" data-z="l">&#9664;</div><div class="dz" data-z="d">&#9660;</div><div class="dz" data-z="r">&#9654;</div></div>
  <div id="bWater" class="tb" data-k="a">VATTEN</div>
  <div id="bJump" class="tb" data-k="j">HOPP</div>
  <div id="bPause" class="tb" data-k="p">II</div>
  
</div>

<div id="rotate"><canvas id="rotPhone" width="16" height="24"></canvas><canvas id="rotText" width="100" height="20"></canvas></div>
<script>
'use strict';
/* =====================================================================
   YARDENA – LEVANDE VATTEN
   En lekfull hyllning till det mandeiska folket. All grafik och allt ljud
   genereras i koden. En enda fil, inga externa resurser.
   ===================================================================== */

/* ============================== KONFIG ============================== */
const DEBUG = false;
const W = 384, H = 216, T = 16, MH = 14;
const PHY = { grav: 900, jump: -330, djump: -290, run: 88, duckRun: 34, acc: 1000, fric: 1300,
  maxFall: 420, coyote: 0.1, jbuf: 0.1, bounce: -440, jumpCut: 1.7 };
const CHARGE = [0.3, 0.8, 1.5];
const COST = [0, 1, 2, 4];
const WMAX = 10;
const PROJ = [null, { r: 3, sp: 210, range: 150 }, { r: 5, sp: 240, range: 210 }, { r: 7, sp: 330, range: 290 }];
const SAVE_KEY = 'yardena_save_v1';

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }

/* ========================= PALETT & SPRITES ========================= */
const PAL = {
  W: '#fbf7ee', w: '#d6cfc0', v: '#a9a397', K: '#1d1612', k: '#3a2c22', S: '#c98d62', s: '#9c6743', E: '#20140c',
  G: '#5cae45', g: '#2f6f2a', B: '#8a5a2b', b: '#5a3818', U: '#5cc3f0', u: '#c9f3ff', Y: '#b4b0a8', y: '#f3d34a',
  N: '#8c5a32', n: '#5e3a1e', R: '#a8402f', r: '#6e2820', O: '#7d7a3a', o: '#555228', T: '#cfa86b', t: '#9c7a45',
  P: '#3b6fb0', p: '#29497a', X: '#ffffff', Z: '#e85a3a', z: '#2a4a8a'
};

function makeSprite(rows, subs) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const [c, g] = mkCanvas(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let ch = rows[y][x];
    if (!ch || ch === '.') continue;
    if (subs && subs[ch] !== undefined) ch = subs[ch];
    if (ch === '.' || !PAL[ch]) continue;
    g.fillStyle = PAL[ch]; g.fillRect(x, y, 1, 1);
  }
  const [f, g2] = mkCanvas(w, h);
  g2.translate(w, 0); g2.scale(-1, 1); g2.drawImage(c, 0, 0);
  return { c, f, w, h };
}
function setRows(base, mods) { const r = base.slice(); for (const k in mods) r[+k] = mods[k]; return r; }
function setChar(rows, x, y, ch) { const r = rows[y]; rows[y] = r.substring(0, x) + ch + r.substring(x + 1); }

// --- Prästen (tarmida): vit rasta, turban, svart skägg, klila (myrten), margna (stav) ---
const PR = [
  "..............B.", ".....wWWWWw...B.", "....wWWWWWWW..B.", "....GgGGgGGg..B.", "....WWWWWWWw..B.",
  "....wSSSSSSs..B.", "....SSSSSESs..B.", "....SSSSSSSS..B.", "....SKKKKKKS..B.", "....KKKKKKKK..B.",
  "....wKKKKKKw..B.", "...wWWKKKKWWw.B.", "...WWWWKKWWWWSB.", "...WWWWWWWWWw.B.", "...WWWWWWWWWw.B.",
  "...SWWWWWWWWw.B.", "....WWWWWWWWw.B.", "....WWWWWWWWw.B.", "....WWWWWWWWw.B.", "....wWWWWWWWw.B.",
  "....WWW..WWW..B.", "....WWW..WWW..B.", "....SSS..SSS..B.", "...sSSS.sSSS..b."];
const LEG_WA = ["...WWW...WWW..B.", "..WWW.....WWW.B.", "..SSS.....SSS.B.", ".sSSS....sSSS.b."];
const LEG_WB = [".....WWWWW....B.", ".....WWWW.....B.", ".....SSSS.....B.", "....sSSSS.....b."];
const LEG_WC = ["....WWW..WWW..B.", "...WWW....WWW.B.", "...SSS....SSS.B.", "..sSSS...sSSS.b."];
const LEG_J = ["...WWWWWWWW...B.", "...WWW..WWW...B.", "..SSS....SSS..B.", "..............b."];
const LEG_F = ["....WWW..WWW..B.", "....WWW..WWW..B.", "....SSS..SSS..B.", "....sSS..sSS..b."];
function legs(l) { return setRows(PR, { 20: l[0], 21: l[1], 22: l[2], 23: l[3] }); }
function staffLeft(rows) {
  const r = rows.map(s => s.substring(0, 14) + '..');
  for (let y = 2; y < 22; y++) setChar(r, 1, y, y === 2 ? 'b' : 'B');
  return r;
}
const PR_CHARGE = (() => {
  let r = setRows(PR, { 11: "...wWWKKKKWWWw..", 12: "...WWWWKKWWWWSS.", 13: "...WWWWWWWWWWSS.",
    20: "...WWW...WWW....", 21: "..WWW.....WWW...", 22: "..SSS.....SSS...", 23: ".sSSS.....sSSS.." });
  return staffLeft(r);
})();
const PR_SHOOT = (() => {
  let r = setRows(PR, { 11: "...wWWKKKKWWWWWW", 12: "...WWWWKKWWWWWSS", 13: "...WWWWWWWWWWw..",
    20: "...WWW...WWW....", 21: "..WWW.....WWW...", 22: "..SSS.....SSS...", 23: ".sSSS.....sSSS.." });
  return staffLeft(r);
})();
const PR_DUCK = PR.slice(0, 10).concat(["...wWWWWWWWWw.B.", "..WWWWWWWWWWWSB.", "..WWWWWWWWWWWWB.", "..sSSSWWWWSSSsb."]);
const PR_IDLE2 = ["................"].concat(PR.slice(0, 10), PR.slice(11));

const SPR = {};
function buildPriest() {
  SPR.pIdle = [makeSprite(PR), makeSprite(PR_IDLE2)];
  SPR.pWalk = [makeSprite(legs(LEG_WA)), makeSprite(legs(LEG_WB)), makeSprite(legs(LEG_WC)), makeSprite(legs(LEG_WB))];
  SPR.pJump = makeSprite(legs(LEG_J));
  SPR.pFall = makeSprite(legs(LEG_F));
  SPR.pCharge = makeSprite(PR_CHARGE);
  SPR.pShoot = makeSprite(PR_SHOOT);
  SPR.pDuck = makeSprite(PR_DUCK);
}

// --- Människomall (mandeer och vanliga människor) ---
const HUM = [
  "................", ".....hHHHHh.....", "....HHHHHHHH....", "....HHHHHHHH....", "....hSSSSSSh....",
  "....SSSSSESh....", "....SSSSSSSS....", "....FSSSSSSs....", "....FFFFFFFF....", ".....FFFFFF.....",
  "....cCCFFCCc....", "...cCCCCCCCCc...", "...cCCCSSCCCc...", "...cCCCSSCCCc...", "...cCCCCCCCCc...",
  "...cCCCCCCCCc...", "...cCCCCCCCCc...", "...cCCCCCCCCc...", "...cCCCCCCCCc...", "....CCCCCCCC....",
  "....CCC..CCC....", "....CCC..CCC....", "....SSS..SSS....", "...sSSS.sSSS...."];
const HL_A = ["...CCC...CCC....", "..CCC.....CCC...", "..SSS.....SSS...", ".sSSS.....sSSS.."];
const HL_B = [".....CCCCC......", ".....CCCC.......", ".....SSSS.......", "....sSSSS......."];
const ARMS_DOWN = { 12: "...cCCCCCCCCc...", 13: "...cCCCCCCCCc...", 18: "...SCCCCCCCCS..." };
function humanFrames(subs, opt) {
  opt = opt || {};
  let base = HUM.slice();
  if (opt.armsDown) base = setRows(base, ARMS_DOWN);
  if (opt.basket) { for (let y = 15; y <= 18; y++) for (let x = 11; x <= 14; x++) setChar(base, x, y, (x + y) % 2 ? 'T' : 't'); setChar(base, 12, 14, 'n'); setChar(base, 13, 14, 'n'); }
  const fr = [base, setRows(base, { 20: HL_A[0], 21: HL_A[1], 22: HL_A[2], 23: HL_A[3] }), setRows(base, { 20: HL_B[0], 21: HL_B[1], 22: HL_B[2], 23: HL_B[3] })];
  const out = fr.map(r => opt.child ? r.filter((_, i) => i < 14 || i > 17) : r);
  return out.map(r => makeSprite(r, subs));
}
const MANDE_VARIANTS = [
  { subs: { H: 'W', h: 'w', F: 'K', C: 'W', c: 'w' } },                 // man med skägg
  { subs: { H: 'W', h: 'W', F: 'S', C: 'W', c: 'w' } },                 // kvinna med vit slöja
  { subs: { H: 'W', h: 'w', F: 'S', C: 'W', c: 'w' }, child: true },    // barn
  { subs: { H: 'W', h: 'w', F: 'Y', C: 'W', c: 'w' } }                  // äldre man, grått skägg
];
const COMMON_VARIANTS = [
  { subs: { H: 'R', h: 'r', F: 'k', C: 'N', c: 'n' } },                 // man med huvudduk
  { subs: { H: 'r', h: 'r', F: 'S', C: 'R', c: 'r' } },                 // kvinna i rödbrun klänning
  { subs: { H: 'k', h: 'k', F: 'S', C: 'O', c: 'o' }, child: true },    // pojke
  { subs: { H: 'T', h: 't', F: 'K', C: 'O', c: 'o' }, basket: true }    // köpman med korg
];
const CYCL = [
  "........hHHh........", ".......HHHHHH.......", ".......hSSSES.......", ".......SKKSSs.......", "........KKK.........",
  "......cCCCCC........", ".....cCCCCCSSS......", ".....cCCCCC..SS.....", "......CCCCC...b.....", "......CC.CC...b.....",
  "....bbbbbbbbbbb.....", "....b.SS...b.b......", "..nnnnn..b.nnnnn....", ".n..b..n..n..b..n...", ".n.bbb.n..n.bbb.n...",
  ".n..b..n..n..b..n...", "..nnnnn....nnnnn...."];
const CYCL2 = setRows(CYCL, { 13: ".n.b...n..n.b...n...", 14: ".n..b..n..n..b..n...", 15: ".n...b.n..n...b.n..." });

function genRows(w, h, fn) { const rows = []; for (let y = 0; y < h; y++) { let s = ''; for (let x = 0; x < w; x++) s += fn(x, y) || '.'; rows.push(s); } return rows; }

function buildOthers() {
  SPR.mande = MANDE_VARIANTS.map(v => humanFrames(v.subs, { child: v.child }));
  SPR.common = COMMON_VARIANTS.map(v => humanFrames(v.subs, { child: v.child, basket: v.basket, armsDown: true }));
  SPR.carrier = humanFrames({ H: 'R', h: 'r', F: 'K', C: 'N', c: 'n' }, { armsDown: true });
  const cs = { H: 'P', h: 'p', C: 'P', c: 'p' };
  SPR.cycl = [makeSprite(CYCL, cs), makeSprite(CYCL2, cs)];
  SPR.carpet = makeSprite(genRows(44, 6, (x, y) => {
    if (x < 2 || x > 41) return (y % 2) ? 'y' : '.';
    if (y === 0 || y === 5) return 'r';
    return (x % 8 < 2) ? 'y' : (x % 8 === 4 ? 'P' : 'R');
  }));
  SPR.leaf = makeSprite(["...gG...", "..gGGG..", ".gGGGGG.", ".gGGgGG.", "..gGgG..", "...gG...", "....b...", "........"]);
  SPR.heart = makeSprite([".rr.rr.", "rZZrZZr", "rZZZZZr", ".rZZZr.", "..rZr..", "...r..."]);
  SPR.heartE = makeSprite([".kk.kk.", "kKKkKKk", "kKKKKKk", ".kKKKk.", "..kKk..", "...k..."]);
  SPR.drop = makeSprite(["..U..", "..U..", ".UuU.", "UuUUU", "UUUUU", "UUUUz", ".zUz."]);
  SPR.dropE = makeSprite(["..z..", "..z..", ".z.z.", "z...z", "z...z", "z...z", ".zzz."]);
  SPR.star = makeSprite(["....y....", "....y....", "...yyy...", "yyyyyyyyy", ".yyyyyyy.", "..yyyyy..", "..yy.yy..", ".yy...yy.", "y.......y"]);
  SPR.starE = makeSprite(["....k....", "....k....", "...kkk...", "kkkkkkkkk", ".kkkkkkk.", "..kkkkk..", "..kk.kk..", ".kk...kk.", "k.......k"]);
  SPR.lock = makeSprite(["..kkk..", ".k...k.", ".k...k.", "kkkkkkk", "kyyyyyk", "kyykyyk", "kyyyyyk", "kkkkkkk"]);
  SPR.sign = makeSprite([
    "................", ".BBBBBBBBBBBBBB.", ".BTTTTTTTTTTTTB.", ".BTnnnTnnTnnnTB.", ".BTTTTTTTTTTTTB.", ".BTnnTnnnTnnTTB.",
    ".BTTTTTTTTTTTTB.", ".BBBBBBBBBBBBBB.", "......bB........", "......bB........", "......bB........",
    "......bB........", "......bB........", "......bB........", ".....bbBB.......", "................"]);
  SPR.lamp = makeSprite(["...bb...", "..b..b..", ".bbbbbb.", ".byyyyb.", ".byXyyb.", ".byyyyb.", ".byyyyb.", ".bbbbbb.", "...bb...", "...bb...", "...bb...", "..bbbb.."]);
  SPR.raft = makeSprite(genRows(32, 7, (x, y) => (x % 9 === 4) ? 'n' : (y === 0 ? 'T' : y === 6 ? 't' : ((x + y) % 3 ? 'T' : 't'))));
  SPR.boat = makeSprite(genRows(44, 9, (x, y) => {
    const e = Math.min(x, 43 - x);
    if (y === 0) return e < 2 ? 'n' : null;
    if (y === 1) return e < 3 ? 'n' : null;
    if (y === 2) return e < 4 ? 'N' : (e < 5 ? 'n' : null);
    if (y < 8) return (y - 2 > 4 - e * 1.2 || e > 3) ? (y === 3 ? 'n' : (y === 7 ? 'n' : (x % 6 === 0 ? 'n' : 'N'))) : null;
    return (e > 4) ? 'n' : null;
  }));
  SPR.date = makeSprite([".N.", "nNn", ".n."]);
  // Palm
  const pr = (() => {
    const w = 24, h = 48, g = [...Array(h)].map(() => Array(w).fill('.'));
    for (let y = 12; y < h; y++) { const cx = Math.round(11 + Math.sin((y - 12) / 36 * 1.5) * 2); g[y][cx] = (y % 3 === 0) ? 'b' : 'B'; g[y][cx + 1] = (y % 3 === 0) ? 'B' : 'b'; }
    const fr = [[-1, 0.3], [1, 0.3], [-1, -0.2], [1, -0.2], [-0.45, -1], [0.5, -1], [-0.9, 0.9], [0.9, 0.9]];
    for (const [dx, dy] of fr) for (let i = 0; i < 11; i++) {
      const x = Math.round(12 + dx * i), y = Math.round(12 + dy * i * 0.7 + i * i * 0.06);
      if (y >= 0 && y < h - 1 && x >= 0 && x < w) { g[y][x] = 'G'; if (g[y + 1][x] === '.') g[y + 1][x] = 'g'; }
    }
    g[13][11] = 'n'; g[13][13] = 'n'; g[14][12] = 'n'; g[14][11] = 'N';
    return g.map(r => r.join(''));
  })();
  SPR.palm = makeSprite(pr);
  // Drabsha: vit tygbanderoll på ett träkors
  const drab = (wave, act) => genRows(16, 34, (x, y) => {
    if (y <= 1 && x >= 5 && x <= 8) return (y === 0 && (x === 5 || x === 8)) ? null : 'G';
    if (y === 3 && x <= 14) return 'B';
    if (y >= 4 && y <= 14) { const off = wave ? ((y % 4 < 2) ? 1 : 0) : 0; const x0 = 2 + off, x1 = 12 + off - Math.floor((y - 4) / 4);
      if (x >= x0 && x <= x1) return act ? ((x === x1) ? 'w' : 'W') : ((x === x1) ? 'Y' : 'v'); }
    if (y === 15) { const off = wave ? 1 : 0; if (x >= 3 + off && x <= 10 + off && x % 2 === 0) return act ? 'W' : 'v'; }
    if (x === 6 || x === 7) return x === 6 ? 'b' : 'B';
    return null;
  });
  SPR.drabOff = makeSprite(drab(0, 0));
  SPR.drabOn = [makeSprite(drab(0, 1)), makeSprite(drab(1, 1))];
  // Mandi: kulthydda av vass och lera
  const mandi = (open) => genRows(48, 40, (x, y) => {
    const dx = (x - 23.5) / 21, top = 15 - Math.round(Math.sqrt(Math.max(0, 1 - dx * dx)) * 11);
    const inDoor = x >= 19 && x <= 28 && y >= 24 && !(y < 27 && (x === 19 || x === 28));
    if (x >= 3 && x <= 44 && y >= top && y <= 16) { if (y === top) return 'n'; return ((x + (y >> 1)) % 4 === 0) ? 't' : 'T'; }
    if (x >= 6 && x <= 41 && y > 16) {
      if (inDoor) return open ? (((x + y) % 5 === 0) ? 'X' : 'y') : 'k';
      if ((x === 18 || x === 29) && y >= 23) return 'b';
      if (y === 23 && x >= 18 && x <= 29) return 'b';
      if (y === 39) return 'n';
      return (x % 3 === 0) ? 't' : 'T';
    }
    return null;
  });
  SPR.mandi = [makeSprite(mandi(0)), makeSprite(mandi(1))];
  SPR.ring = makeSprite(["..UUU..", ".U...U.", "U.....U", "U.....U", "U.....U", ".U...U.", "..UUU.."]);
}

// --- Pixeltypsnitt 3x5 (inkl. ÅÄÖ) ---
const FONT = { A: '25755', B: '65656', C: '34443', D: '65556', E: '74647', F: '74644', G: '34553', H: '55755', I: '72227', J: '11152',
  K: '55655', L: '44447', M: '57755', N: '65555', O: '25552', P: '65644', Q: '25573', R: '65655', S: '34216', T: '72222', U: '55557',
  V: '55552', W: '55775', X: '55255', Y: '55222', Z: '71247', '0': '75557', '1': '26227', '2': '61247', '3': '61216', '4': '55711',

function buildLevel(ops) {
  const MAXW = 420; const m = []; for (let r = 0; r < MH; r++) m.push(Array(MAXW).fill('.'));
  let x = 0, gy = 11; const ents = [], signs = []; let start = { c: 2, r: 10 };
  const ground = c => { for (let r = gy; r < MH; r++) m[r][c] = '#'; };
  const addEnts = (str, c0, row) => { for (let i = 0; i < str.length; i++) { const ch = str[i]; if (ch === '.' || ch === ' ') continue;
    ents.push({ t: ch === 'y' ? 'Y' : ch, c: c0 + i, r: ch === 'y' ? row - 3 : row }); } };
  for (const op of ops) {
    const k = op[0];
    switch (k) {
      case 'f': for (let i = 0; i < op[1]; i++) ground(x + i); if (op[2]) addEnts(op[2], x, gy - 1); x += op[1]; break;
      case 'w': for (let i = 0; i < op[1]; i++) { ground(x + i); m[gy - 1][x + i] = '~'; } if (op[2]) addEnts(op[2], x, gy - 1); x += op[1]; break;
      case 's': for (let i = 0; i < op[1]; i++) { for (let r = gy + 1; r < MH; r++) m[r][x + i] = '#'; m[gy][x + i] = '%'; } x += op[1]; break;
      case 'g': x += op[1]; break;
      case 'br': for (let i = 0; i < op[1]; i++) m[gy][x + i] = '='; x += op[1]; break;
      case 'u': gy -= op[1]; break;
      case 'd': gy += op[1]; break;
      case 'p': case 'pa': case 'pc': { const off = op[1], len = op[2], h = op[3]; const ch = k === 'p' ? '=' : k === 'pa' ? 'A' : 'D'; const r = gy - h;
        for (let i = 0; i < len; i++) m[r][x + off + i] = ch; if (op[4]) addEnts(op[4], x + off, r - 1); break; }
      case 'c': for (let i = 0; i < op[1]; i++) { ground(x + i); for (let r = 0; r <= gy - 2; r++) m[r][x + i] = '#'; } x += op[1]; break;
      case 'r': for (let i = 1; i < op[1] - 1; i += 3) ents.push({ t: 'raft', c: x + i, r: gy }); x += op[1]; break;
      case 'b': ents.push({ t: 'boat', c: x, r: gy, span: op[1] }); x += op[1]; break;
      case 'S': signs.push({ c: x + (op[2] || 0), r: gy - 1, text: op[1] }); break;
      case 'K': ents.push({ t: 'K', c: x + (op[1] || 0), r: gy - 1 }); break;
      case 'E': ents.push({ t: 'E', c: x, r: gy - 1 }); break;
      case 't': ents.push({ t: 'tree', c: x + (op[1] || 0), r: gy - 1, dates: !!op[2] }); break;
      case 'l': ents.push({ t: 'lamp', c: x + (op[1] || 0), r: gy - 1 }); break;
      case 'P': start = { c: x + (op[1] || 0), r: gy - 1 }; break;
    }
  }
  return { map: m.map(row => row.slice(0, x)), w: x, ents, signs, start };
}

const PMAX = 500; const parts = []; for (let i = 0; i < PMAX; i++) parts.push({ on: false });

function part(x, y, vx, vy, life, col, g, size) {
  const p = parts[pIdx]; pIdx = (pIdx + 1) % PMAX;
  p.on = true; p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = life; p.max = life; p.col = col; p.g = g || 0; p.s = size || 1; return p;
}
function burst(x, y, n, cols, sp, g, life, size) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = sp * (0.3 + Math.random() * 0.7);
    part(x, y, Math.cos(a) * v, Math.sin(a) * v - sp * 0.3, life * (0.6 + Math.random() * 0.6), cols[i % cols.length], g, size); }
}

function loadLevel(idx) {
  const def = LEVELS[idx]; const b = buildLevel(def.ops); const th = THEMES[def.theme];
  L = { idx, def, th, map: b.map, w: b.w, pw: b.w * T, signs: b.signs.map(s => ({ x: s.c * T, y: (s.r + 1) * T, text: s.text })),

      case 'raft': L.plats.push({ type: 'raft', x: x, y: feet - T + 4, by: feet - T + 4, w: 32, h: 6, sink: 0, dx: 0, dy: 0, ph: Math.random() * 6 }); break;
      case 'boat': L.plats.push({ type: 'boat', x: x, y: feet - T + 4, by: feet - T + 4, w: 44, h: 8, x0: x, x1: x + e.span * T - 44, dir: 1, dx: 0, dy: 0, ph: Math.random() * 6 }); break;

  L.checkpoint = { x: sx, y: sy };
  Object.assign(player, { x: sx, y: sy, w: 10, h: 22, vx: 0, vy: 0, face: 1, onGround: false, coyote: 0, jbuf: 0, canDbl: true,
    duck: false, charging: false, charge: 0, shootT: 0, inv: 0, stun: 0, hearts: 3, water: L.tutorial ? 0 : WMAX, refill: false,
    anim: 0, plat: null, lastSafe: { x: sx, y: sy }, gch: null, refT: 0 });
  cam.x = clamp(player.x - W / 2, 0, Math.max(0, L.pw - W)); cam.y = MH * T - H;

function addMande(cx, feet, v, walker) {
  const child = MANDE_VARIANTS[v].child, h = child ? 18 : 22;
  L.npcs.push({ kind: 'mande', v, x: cx - 5, y: feet - h, w: 10, h, vx: 0, vy: 0, dir: Math.random() < 0.5 ? -1 : 1, home: cx - 5,
    range: 14, speed: walker ? 9 : 0, state: 'wait', t: 0, ph: Math.random() * 6, onGround: false, cross: false, alpha: 1 });
}
function addCommon(cx, feet, beh, v) {
  const child = beh !== 'cycle' && beh !== 'carry' && COMMON_VARIANTS[v].child;
  let w = 10, h = child ? 18 : 22, speed = 22, range = 48;
  if (beh === 'run') { speed = 62; range = 80; } if (beh === 'cycle') { w = 16; h = 14; speed = 105; range = 150; }
  if (beh === 'carry') { speed = 18; range = 40; } if (beh === 'jump') { speed = 24; range = 40; }
  const n = { kind: 'common', beh, v, x: cx - w / 2, y: feet - h, w, h, vx: 0, vy: 0, dir: -1, home: cx - w / 2, range, speed,
    wet: false, annoy: 0, t: Math.random() * 3, onGround: false, cross: false, hopT: 1 + Math.random() };
  L.npcs.push(n); return n;
}

function tileAt(c, r) {
  if (r < 0) return '.'; if (r >= MH) return '.';
  if (c < 0 || c >= L.w) return L.final ? (r >= 11 ? '#' : '.') : '#';
  return L.map[r][c];
}
const solidCh = ch => ch === '#' || ch === 'D' || ch === 'A';
function solidAt(px, py) { return solidCh(tileAt(Math.floor(px / T), Math.floor(py / T))); }
function moveBody(o, dt) {
  o.hitWall = false;
  o.x += o.vx * dt;
  const r0 = Math.floor(o.y / T), r1 = Math.floor((o.y + o.h - 0.01) / T);
  if (o.vx > 0) { const c = Math.floor((o.x + o.w) / T); for (let r = r0; r <= r1; r++) if (solidCh(tileAt(c, r))) { o.x = c * T - o.w - 0.001; o.vx = 0; o.hitWall = true; break; } }
  else if (o.vx < 0) { const c = Math.floor(o.x / T); for (let r = r0; r <= r1; r++) if (solidCh(tileAt(c, r))) { o.x = (c + 1) * T + 0.001; o.vx = 0; o.hitWall = true; break; } }
  const oldB = o.y + o.h; o.y += o.vy * dt; o.onGround = false; o.gch = null; o.plat = null;
  const c0 = Math.floor((o.x + 0.5) / T), c1 = Math.floor((o.x + o.w - 0.5) / T);
  if (o.vy >= 0) {
    const r = Math.floor((o.y + o.h) / T);
    for (let c = c0; c <= c1; c++) { const ch = tileAt(c, r);
      if (solidCh(ch) || (ch === '=' && oldB <= r * T + 0.5)) { o.y = r * T - o.h; o.vy = 0; o.onGround = true; o.gch = ch; o.gc = c; o.gr = r; break; } }

  'IDÉ & DESIGN', 'FADI', '', 'GRAFIK, MUSIK OCH KOD', 'GENERERAT HELT I WEBBLÄSAREN', '', 'EN LEKFULL HYLLNING', 'TILL DET MANDEISKA FOLKET', '', '', 'TACK FÖR ATT DU SPELADE!'];
function updateEnding(dt) { endT += dt; if ((endT > 4 && (pr('ok') || pr('back') || taps.length)) || endT > 40) go(() => setState('title')); }
function drawEnding() {
  const th = THEMES.fest; if (!BG.endSky) { BG.endSky = buildSky(th, W, H); BG.endFar = buildFar(th, 'fest'); BG.endMid = buildMid(th, 'fest'); }
  ctx.drawImage(BG.endSky, 0, 0); ctx.drawImage(BG.endFar, 0, 0); ctx.drawImage(BG.endMid, 0, 0);
  ctx.fillStyle = th.river; ctx.fillRect(0, 196, W, 20); ctx.fillStyle = th.riverL; for (let i = 0; i < 40; i++) ctx.fillRect(((i * 53 + Math.floor(gt * 25)) % (W + 10)) - 5, 198 + (i * 5) % 16, 4, 1);
  ctx.fillStyle = th.top; ctx.fillRect(0, 186, W, 4); ctx.fillStyle = th.fill; ctx.fillRect(0, 190, W, 6);
  drawSpr(SPR.mandi[1], 10, 146); drawSpr(SPR.drabOn[Math.floor(gt * 3) % 2], 70, 152); drawSpr(SPR.palm, 340, 138);
  drawSpr(SPR.pIdle[Math.floor(gt * 1.6) % 2], 96, 162);
  for (let i = 0; i < 12; i++) { const fr = SPR.mande[i % 4]; const s = fr[0]; const x = 120 + i * 18, hop = Math.max(0, Math.sin(gt * 4 + i)) * 3;
    drawSpr(s, x, 186 - s.h - Math.round(hop), true); ctx.fillStyle = '#5cae45'; ctx.fillRect(x + 4, 186 - s.h - Math.round(hop) + 2, 8, 1); }
  if (Math.random() < 0.3) part(Math.random() * W, 196, 0, -20 - Math.random() * 20, 3, Math.random() < 0.5 ? '#f3d34a' : '#fff6c0', -2);
  for (const p of parts) if (p.on) { p.life -= 1 / 60; if (p.life <= 0) { p.on = false; continue; } p.x += p.vx / 60; p.y += p.vy / 60; ctx.globalAlpha = Math.min(1, p.life); ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1); }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,20,0.35)'; ctx.fillRect(0, 0, W, 140);
  const y0 = 150 - endT * 14;
  CREDITS.forEach((l, i) => { const y = y0 + i * 12 + (i > 0 ? 10 : 0); if (y < -16 || y > 140) return; const big = i === 0; drawText(l, W / 2, y, big ? '#5cc3f0' : (i === 1 ? '#f3d34a' : '#fff'), big ? 3 : 1, 'center', true); });
}

/* ======================= TRANSITION & LOOP ======================= */
function drawFade() {
  if (!fade) return; const prog = fade.phase === 'out' ? fade.t / 0.35 : 1 - fade.t / 0.35;
  ctx.fillStyle = '#000';
  for (let y = 0; y < H; y += 8) for (let x = 0; x < W; x += 8) { const b = (BAYER[((y >> 3) % 4) * 4 + ((x >> 3) % 4)] + 0.5) / 16; if (b < prog) ctx.fillRect(x, y, 8, 8); }
}
function update(dt) {
  pollInput(); gt += dt; stT += dt;
  if (fade) { fade.t += dt; if (fade.phase === 'out' && fade.t >= 0.35) { fade.cb(); fade.phase = 'in'; fade.t = 0; } else if (fade.phase === 'in' && fade.t >= 0.35) fade = null; }
  if (!fade || fade.phase === 'in') {
    switch (state) {
      case 'title': updateTitle(); break; case 'select': updateSelect(); break; case 'settings': updateSettings(); break;
      case 'about': updateAbout(); break; case 'play': updatePlay(dt); break; case 'pause': updatePause(); break;
      case 'complete': updateComplete(dt); break; case 'gameover': updateGameOver(); break; case 'ending': updateEnding(dt); break;
    }
  }
  if (state !== 'play' && toastMsg) { toastMsg.t -= dt; if (toastMsg.t <= 0) toastMsg = null; }
  taps.length = 0; endInput();
}
function render() {
  hits = [];
  switch (state) {
    case 'title': drawTitle(); break; case 'select': drawSelect(); break; case 'settings': drawSettings(); break;
    case 'about': drawAbout(); break; case 'play': drawWorld(); drawHUD(); if (fadeFlash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + fadeFlash * 0.6 + ')'; ctx.fillRect(0, 0, W, H); } break;
    case 'pause': drawPause(); break; case 'complete': drawComplete(); break; case 'gameover': drawGameOver(); break; case 'ending': drawEnding(); break;
  }
  if (state !== 'play' && state !== 'pause' && toastMsg) { drawText(toastMsg.text, W / 2, H - 14, '#f3d34a', 1, 'center', true); }
  drawFade();
}
let acc = 0, last = 0, fpsAcc = 0, fpsN = 0;
const STEP = 1 / 60;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts; let d = (ts - last) / 1000; last = ts; if (d > 0.25) d = 0.25;
  fpsAcc += d; fpsN++; if (fpsAcc >= 1) { fps = fpsN; fpsN = 0; fpsAcc = 0; }
  acc += d; let n = 0;
  while (acc >= STEP && n < 5) { update(STEP); acc -= STEP; n++; }
  if (n === 5) acc = 0;
  render();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (state === 'play') openPause(); if (AU.ctx) AU.ctx.suspend(); for (const k of KEYS) kb[k] = 0; }
  else if (AU.ctx) AU.ctx.resume();
});
window.addEventListener('resize', () => { if (isTouch && state === 'play' && innerHeight > innerWidth) openPause(); });

/* ---------------------- VRID-TELEFONEN-SKÄRM ---------------------- */

  const rows = ["................", "..kkkkkkkkkkkk..", ".kYYYYYYYYYYYYk.", ".kYzzzzzzzzzzYk.", ".kYzUUUUUUUUzYk.", ".kYzUuUUUUUUzYk.", ".kYzUUUUUUUUzYk.", ".kYzUUUUGGUUzYk.",
    ".kYzUUUGGGGUzYk.", ".kYzUUUUWWUUzYk.", ".kYzUUUUWWUUzYk.", ".kYzUUUWWWWUzYk.", ".kYzUUUWWWWUzYk.", ".kYzyyyyyyyyzYk.", ".kYzTTTTTTTTzYk.", ".kYzTTTTTTTTzYk.",
    ".kYzUUUUUUUUzYk.", ".kYzUUUUUUUUzYk.", ".kYzzzzzzzzzzYk.", ".kYYYYYYYYYYYYk.", ".kYYYYYkkYYYYYk.", ".kYYYYYYYYYYYYk.", "..kkkkkkkkkkkk..", "................"];
  rows.forEach((r, y) => { for (let x = 0; x < 16; x++) { const ch = r[x]; if (ch !== '.' && PAL[ch]) { pc.fillStyle = PAL[ch]; pc.fillRect(x, y, 1, 1); } } });
  const tcv = document.getElementById('rotText'), tg = tcv.getContext('2d');
  const old = ctx; // återanvänd drawText via temporär kontext
  const lines = ['VRID TELEFONEN TILL', 'LIGGANDE LÄGE'];
  lines.forEach((l, i) => { const s = normText(l); const x0 = Math.round(50 - (s.length * 4 - 1) / 2);
    for (let k = 0; k < s.length; k++) if (s[k] !== ' ') tg.drawImage(glyph(s[k], '#f3d34a'), x0 + k * 4, 3 + i * 9); });
}

/* ============================== START ============================== */
buildPriest(); buildOthers(); buildRotate(); resize(); setState('title');
requestAnimationFrame(frame);
